<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat With a PDF — RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171f;
    --bg-soft: #1b1f29;
    --line: #2a2f3b;
    --paper: #f6f1e4;
    --paper-2: #efe8d6;
    --ink: #21242c;
    --text: #e9e7e0;
    --muted: #8b90a0;
    --accent: #7ee0c0;
    --accent-ink: #072b22;
    --error: #ff7a7a;
    --error-bg: rgba(255,122,122,0.1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 20px 80px; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow .badge {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 40px;
    line-height: 1.15;
    margin: 0 0 40px;
    letter-spacing: -0.01em;
  }
  h1 mark {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 0 6px;
    border-radius: 3px;
  }

  .stack { position: relative; margin-bottom: 28px; }
  .stack::before, .stack::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--paper-2);
    border-radius: 10px;
    z-index: 0;
  }
  .stack::before { transform: rotate(-2.5deg) translateY(3px); opacity: 0.55; }
  .stack::after { transform: rotate(2deg) translateY(1px); opacity: 0.8; }

  .paper-card {
    position: relative;
    z-index: 1;
    background: var(--paper);
    color: var(--ink);
    border-radius: 10px;
    padding: 28px;
    box-shadow: 0 14px 30px -12px rgba(0,0,0,0.5);
  }

  .dropzone {
    border: 1.5px dashed #c9c0a6;
    border-radius: 8px;
    padding: 34px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone.drag-over { border-color: var(--ink); background: rgba(0,0,0,0.03); }
  .dropzone input { display: none; }
  .dropzone .icon { font-size: 26px; margin-bottom: 8px; }
  .dropzone .primary { font-weight: 500; }
  .dropzone .secondary { font-size: 13px; color: #6b6555; margin-top: 4px; }

  .file-summary { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .file-summary .name { font-weight: 600; font-size: 16px; margin-bottom: 8px; word-break: break-word; }
  .file-summary .stats {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #6b6555;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .stats span { background: rgba(0,0,0,0.06); padding: 3px 8px; border-radius: 20px; }
  .swap-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: none;
    border: 1px solid #c9c0a6;
    color: var(--ink);
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
  }
  .swap-btn:hover { background: rgba(0,0,0,0.06); }

  .upload-btn {
    margin-top: 16px;
    width: 100%;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  #status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
    min-height: 18px;
    margin-bottom: 8px;
  }
  #status.error { color: var(--error); }

  #thread { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .note {
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 14.5px;
    line-height: 1.5;
    max-width: 88%;
  }
  .note.question {
    align-self: flex-end;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text);
  }
  .note.answer {
    align-self: flex-start;
    background: var(--paper);
    color: var(--ink);
    border-top-left-radius: 2px;
    box-shadow: 0 8px 18px -10px rgba(0,0,0,0.5);
    white-space: pre-wrap;
  }
  .note.answer.error { background: var(--error-bg); color: var(--error); }
  .note.answer.pending { color: #6b6555; font-style: italic; }
  .note-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #8a8365;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,0.08);
  }

  .composer { display: flex; gap: 8px; }
  .composer input {
    flex: 1;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .composer input:focus { outline: none; border-color: var(--accent); }
  .composer input::placeholder { color: var(--muted); }
  .composer button {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .composer button:disabled { opacity: 0.5; cursor: not-allowed; }

  #chat-section { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Document Assistant <span class="badge">RAG</span></div>
  <h1>Chat with a <mark>PDF</mark></h1>

  <div id="upload-section">
    <div class="stack">
      <div class="paper-card">
        <div class="dropzone" id="dropzone" onclick="document.getElementById('pdf-file').click()">
          <input type="file" id="pdf-file" accept="application/pdf">
          <div class="icon">&#128196;</div>
          <div class="primary" id="dz-label">Click to choose a PDF, or drag one here</div>
          <div class="secondary">Max 10 MB &mdash; large PDFs are fine, they get chunked</div>
        </div>
        <button class="upload-btn" id="upload-btn" onclick="uploadPDF()">Upload document</button>
      </div>
    </div>
  </div>

  <div id="file-section" style="display:none;">
    <div class="stack">
      <div class="paper-card">
        <div class="file-summary">
          <div>
            <div class="name" id="file-name"></div>
            <div class="stats">
              <span id="stat-pages"></span>
              <span id="stat-chars"></span>
              <span id="stat-chunks"></span>
            </div>
          </div>
          <button class="swap-btn" onclick="resetApp()">New document</button>
        </div>
      </div>
    </div>
  </div>

  <div id="status"></div>

  <div id="chat-section">
    <div id="thread"></div>
    <div class="composer">
      <input type="text" id="question" placeholder="Ask something about this document..." onkeypress="handleKeyPress(event)">
      <button id="ask-btn" onclick="askQuestion()">Ask</button>
    </div>
  </div>
</div>

<script>
  let currentDocumentId = null;

  const fileInput = document.getElementById("pdf-file");
  const dropzone = document.getElementById("dropzone");

  fileInput.addEventListener("change", () => {
    if (fileInput.files.length > 0) {
      document.getElementById("dz-label").textContent = fileInput.files[0].name;
    }
  });

  ["dragover", "dragleave", "drop"].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.toggle("drag-over", evt === "dragover");
      if (evt === "drop" && e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        document.getElementById("dz-label").textContent = e.dataTransfer.files[0].name;
      }
    });
  });

  function setStatus(message, isError = false) {
    const statusDiv = document.getElementById("status");
    statusDiv.textContent = message;
    statusDiv.classList.toggle("error", isError);
  }

  function handleKeyPress(event) {
    if (event.key === "Enter") askQuestion();
  }

  function resetApp() {
    currentDocumentId = null;
    fileInput.value = "";
    document.getElementById("dz-label").textContent = "Click to choose a PDF, or drag one here";
    document.getElementById("file-section").style.display = "none";
    document.getElementById("upload-section").style.display = "block";
    document.getElementById("chat-section").style.display = "none";
    document.getElementById("thread").innerHTML = "";
    document.getElementById("question").value = "";
    setStatus("");
  }

  async function uploadPDF() {
    const uploadBtn = document.getElementById("upload-btn");

    if (fileInput.files.length === 0) {
      setStatus("Please choose a PDF file first.", true);
      return;
    }

    const file = fileInput.files[0];
    const maxSizeBytes = 10 * 1024 * 1024;

    if (file.size > maxSizeBytes) {
      setStatus(`File is too large (${(file.size / 1024 / 1024).toFixed(1)} MB). Maximum allowed size is 10 MB.`, true);
      return;
    }

    const formData = new FormData();
    formData.append("file", file);

    uploadBtn.disabled = true;
    setStatus("Uploading, extracting, chunking, and embedding...");

    try {
      const response = await fetch("/upload", { method: "POST", body: formData });
      const data = await response.json();

      if (data.error) {
        setStatus("Error: " + data.error, true);
        return;
      }

      currentDocumentId = data.document_id;
      document.getElementById("file-name").textContent = data.filename;
      document.getElementById("stat-pages").textContent = data.num_pages + " pages";
      document.getElementById("stat-chars").textContent = data.char_count + " chars";
      document.getElementById("stat-chunks").textContent = data.num_chunks + " chunks";

      document.getElementById("upload-section").style.display = "none";
      document.getElementById("file-section").style.display = "block";
      document.getElementById("chat-section").style.display = "block";
      setStatus("");
    } catch (err) {
      setStatus("Upload failed: " + err.message, true);
    } finally {
      uploadBtn.disabled = false;
    }
  }

  function addNote(kind, text, meta) {
    const thread = document.getElementById("thread");
    const note = document.createElement("div");
    note.className = "note " + kind;
    note.textContent = text;
    if (meta) {
      const metaDiv = document.createElement("div");
      metaDiv.className = "note-meta";
      metaDiv.textContent = meta;
      note.appendChild(metaDiv);
    }
    thread.appendChild(note);
    note.scrollIntoView({ behavior: "smooth", block: "end" });
    return note;
  }

  async function askQuestion() {
    const questionInput = document.getElementById("question");
    const askBtn = document.getElementById("ask-btn");

    if (!currentDocumentId) {
      setStatus("Please upload a PDF first.", true);
      return;
    }

    const question = questionInput.value.trim();
    if (!question) return;

    addNote("question", question);
    const pending = addNote("answer pending", "Retrieving relevant chunks and thinking...");
    questionInput.value = "";

    askBtn.disabled = true;
    questionInput.disabled = true;

    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ document_id: currentDocumentId, question: question })
      });
      const data = await response.json();

      pending.classList.remove("pending");
      pending.textContent = "";

      if (data.error) {
        pending.classList.add("error");
        pending.textContent = data.error;
      } else {
        pending.textContent = data.answer;
        const metaDiv = document.createElement("div");
        metaDiv.className = "note-meta";
        metaDiv.textContent = `Retrieved ${data.chunks_used} relevant chunk(s) to answer this`;
        pending.appendChild(metaDiv);
      }
    } catch (err) {
      pending.classList.remove("pending");
      pending.classList.add("error");
      pending.textContent = "Request failed: " + err.message;
    } finally {
      askBtn.disabled = false;
      questionInput.disabled = false;
      questionInput.focus();
    }
  }
</script>
</body>
</html>
